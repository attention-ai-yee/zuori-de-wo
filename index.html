<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#13111d">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>body{padding-top:env(safe-area-inset-top,0px)!important;padding-bottom:env(safe-area-inset-bottom,0px)!important}</style>
<title>昨日的我</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: full-screen puzzle scene in the style of mobile puzzle mini-games — slim title strip at the top
   (right corner left empty for the WeChat capsule), the board filling the screen and driven by swipes/taps,
   one row of round icon buttons at the bottom. On wide screens the game sits in a phone-sized column. */
:root{
  --bg:#0d0c15; --app:#16132a; --panel:#221d3a; --line:#3a3456; --ink:#ece6ff; --dim:#9189b3;
  --amber:#f2a33a; --sky:#4fc3f7; --violet:#b388ff; --mint:#7ee081; --cyan:#5ee6e6; --cyanD:#1f7f86;
  --display:'ZCOOL QingKe HuangYou','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --body:system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;max-width:460px;display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 45%,#221c3d 0%,var(--app) 60%,#0f0d1c 100%);box-sizing:border-box;padding:8px 0 10px;overflow:hidden}
@media (min-width:600px) and (min-height:640px){
  body{background:var(--bg)}
  #app{height:min(100% - 32px,900px);border:1px solid var(--line);border-radius:28px;padding:12px 14px 14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
}
/* top strip: back on the left, level title centred, right side kept clear */
#top{display:grid;grid-template-columns:44px 1fr 44px;align-items:start;min-height:44px}
.ico{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);border:none;cursor:pointer;display:grid;place-items:center}
.ico svg{width:20px;height:20px}
#lvbox{text-align:center;min-width:0}
#lvname{font-family:var(--display);font-size:22px;line-height:1.05;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvname small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.2em;color:var(--dim)}
#status{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;min-height:20px;flex-wrap:wrap}
#pips{display:flex;gap:5px;align-items:center}
.pip{width:9px;height:9px;border:2px solid #5a5380;transform:rotate(45deg);box-sizing:border-box}
.pip.on{border-color:transparent}
#pipLabel{font-size:11px;color:var(--dim);margin-right:2px}
#steps{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
#steps b{color:var(--ink);font-size:13px}
#timeline{display:flex;gap:4px 10px;flex-wrap:wrap;justify-content:center;min-height:14px;margin-top:4px}
.tl{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim)}
.tl i{display:block;width:34px;height:3px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.tl i em{position:absolute;inset:0 auto 0 0;background:currentColor}
/* board */
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(20,17,34,.92);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  font-size:12.5px;max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#coach{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(20,17,34,.88);border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:var(--ink);pointer-events:none;white-space:nowrap}
#coach i{display:block;width:22px;height:22px;border-radius:50%;background:var(--ink);opacity:.9;animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%{transform:translateX(-10px);opacity:0}20%{opacity:.9}80%{opacity:.9}100%{transform:translateX(14px);opacity:0}}
#hint{all:unset;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--dim);line-height:1.45;font-size:12.5px;text-align:center;
  padding:6px 8px 0;min-height:2.9em;cursor:pointer}
#hint.open{-webkit-line-clamp:unset}
/* bottom bar: round icon buttons, rewind in the middle */
#bar{display:flex;justify-content:space-around;align-items:flex-end;padding:10px 4px 0}
.ab{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);min-width:56px}
.ab .o{width:48px;height:48px;border-radius:50%;background:var(--panel);box-shadow:0 3px 0 #0c0a16, inset 0 1px 0 rgba(255,255,255,.08);display:grid;place-items:center;color:var(--ink)}
.ab svg{width:22px;height:22px}
.ab:active .o{transform:translateY(2px);box-shadow:0 1px 0 #0c0a16}
.ab.rw .o{width:66px;height:66px;background:linear-gradient(180deg,#38c4c9,var(--cyanD));box-shadow:0 4px 0 #0d4448, 0 0 24px rgba(94,230,230,.25);color:#f2ffff}
.ab.rw svg{width:30px;height:30px}
.ab.rw{color:var(--cyan)}
.ab.rw:active .o{box-shadow:0 1px 0 #0d4448}
#keys{display:none;color:#6f6890;font-size:11px;text-align:center;margin-top:8px}
@media (pointer:fine){#keys{display:block}}
@media (max-height:620px){#timeline{display:none} #hint{-webkit-line-clamp:1;min-height:1.45em} .ab .o{width:42px;height:42px} .ab.rw .o{width:56px;height:56px}}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(10,9,16,.86);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding:14px;box-sizing:border-box}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 18px 18px;width:100%;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;letter-spacing:.04em}
.card p{margin:0;line-height:1.65;color:var(--dim)}
.card p b{color:var(--ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{border:none;border-radius:14px;background:#2d2748;box-shadow:0 4px 0 #120f1f;padding:14px 10px;font-size:16px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #120f1f}
.btn.pri{background:var(--ink);color:var(--app);box-shadow:0 4px 0 #8f87b0}
.btn.sm{font-size:14px;padding:11px 8px}
#titleOv{align-items:stretch;background:linear-gradient(180deg,rgba(13,12,21,.5),rgba(13,12,21,.97) 55%)}
#titleOv .wrap{display:flex;flex-direction:column;justify-content:flex-end;gap:16px;width:100%;padding-bottom:6px}
#titleOv h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,17vw,78px);margin:0;letter-spacing:.06em;line-height:1;text-shadow:0 4px 0 #2a2540}
#titleOv .sub{color:var(--cyan);font-size:13px;letter-spacing:.3em}
#titleOv p{margin:0;line-height:1.7;color:var(--dim)}
#titleOv p b{color:var(--ink)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:12.5px;color:var(--dim);align-items:center}
.sw{width:14px;height:14px;display:inline-block;border-radius:3px}
#titleOv .btn{padding:16px 10px;font-size:18px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.lv span{font-family:var(--display);font-size:24px;line-height:1}
.lv b{font-weight:400;font-size:12px;white-space:nowrap}
.lv small{color:var(--dim);font-size:10.5px}
.lv.done{border-color:#4f8f56}
.lv.done small{color:var(--mint)}
.lv:disabled{opacity:.35;cursor:not-allowed}
#winOv .card{text-align:center;align-items:stretch}
#winT{font-size:44px}
@media (prefers-reduced-motion:reduce){#toast{transition:none} #coach i{animation:none}}
</style>
</head>
<body>


<div id="app">
  <div id="top">
    <button class="ico" id="menuBtn" type="button" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div id="lvbox">
      <div id="lvname"><small>第 1 关</small>回声</div>
      <div id="status"><div id="pips" aria-label="影子名额"></div><div id="steps">第 <b id="stepN">0</b> 步</div></div>
      <div id="timeline"></div>
    </div>
    <span></span>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="coach" hidden><i></i>在棋盘上滑动来移动，点自己原地等一步</div></div>
  <button id="hint" type="button"></button>
  <div id="bar">
    <button class="ab" data-c="undo" type="button"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></span>撤销</button>
    <button class="ab" data-c="wait" type="button"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg></span>等待</button>
    <button class="ab rw" data-c="rewind" type="button"><span class="o"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2.5 12zM21.5 6v12L13 12z"/></svg></span>回溯</button>
    <button class="ab" data-c="retry" type="button"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></span>重走</button>
    <button class="ab" data-c="solve" type="button"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span><span id="solveBtn">提示</span></button>
  </div>
  <div id="keys">键盘：方向键/WASD 移动 · 空格 等待 · R 回溯 · Z 撤销 · X 重走 · Esc 清空影子</div>

  <div class="ov" id="titleOv">
    <div class="wrap">
      <div class="sub">一个和过去的自己合作的解谜游戏</div>
      <h1>昨日的我</h1>
      <p>你可以把时间倒回这一关的开头。<br>刚才的你会变成<b>影子</b>，把你按过的每个键原样再按一遍。<br>他不知道你在想什么，他只会照做。</p>
      <div class="legend">
        <span class="sw" style="background:var(--amber)"></span><span>压力板：有人或箱子踩住时，同色的门打开</span>
        <span class="sw" style="background:repeating-linear-gradient(45deg,var(--sky) 0 3px,transparent 3px 6px);outline:1px solid var(--sky)"></span><span>反向门（斜纹）：同色板被踩住时反而关上</span>
        <span class="sw" style="background:var(--cyan);opacity:.75"></span><span>影子：重复你上一轮的按键，撞墙也照撞</span>
      </div>
      <div class="row"><button class="btn pri" id="startBtn" type="button">开始游戏</button></div>
      <div class="row"><button class="btn" id="selBtn" type="button">选关</button></div>
    </div>
  </div>
  <div class="ov" id="selOv" hidden>
    <div class="card">
      <h2>菜单</h2>
      <div id="grid"></div>
      <div class="row"><button class="btn sm" id="resetBtn" data-c="reset" type="button">清空本关影子</button><button class="btn sm" id="muteBtn" type="button">声音：开</button></div>
      <div class="row"><button class="btn" id="selClose" type="button">继续游戏</button></div>
    </div>
  </div>
  <div class="ov" id="winOv" hidden>
    <div class="card">
      <h2 id="winT">通关</h2>
      <p id="winP"></p>
      <div class="row"><button class="btn pri" id="nextBtn" type="button">下一关</button></div>
      <div class="row"><button class="btn" id="againBtn" type="button">再玩一次</button><button class="btn" id="winSel" type="button">选关</button></div>
    </div>
  </div>
</div>

<script>
// ===== ENGINE (shared by game & tests) =====
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],W:[0,0]};
function parseLevel(L){
  const rows=L.map, H=rows.length, W=Math.max(...rows.map(r=>r.length));
  const g={W,H,tiles:[],plates:{},doors:[],doorAt:{},start:null,exit:null,boxes:[]};
  for(let y=0;y<H;y++){g.tiles.push([]);for(let x=0;x<W;x++){
    let c=rows[y][x]||'#';
    if(c==='S'){g.start={x,y};c='.';}
    else if(c==='E'){g.exit={x,y};}
    else if(c==='o'){g.boxes.push({x,y});c='.';}
    else if('abcd'.includes(c)){g.plates[x+','+y]=c;}
    else if('ABCD'.includes(c)){g.doors.push({x,y,col:c.toLowerCase(),inv:false});}
    else if('1234'.includes(c)){g.doors.push({x,y,col:'abcd'['1234'.indexOf(c)],inv:true});}
    g.tiles[y].push(c);
  }}
  g.doors.forEach((d,i)=>g.doorAt[d.x+','+d.y]=i);
  return g;
}
// agents: [ghost0..ghostN-1, player]; ghosts act first, in order.
function initState(g,n){return {t:0,a:Array.from({length:n+1},()=>({x:g.start.x,y:g.start.y})),boxes:g.boxes.map(b=>({...b})),won:false};}
function cloneState(s){return {t:s.t,a:s.a.map(q=>({x:q.x,y:q.y})),boxes:s.boxes.map(b=>({x:b.x,y:b.y})),won:s.won};}
function pressedOf(g,st,skip){const s={};const chk=o=>{if(o===skip)return;const c=g.plates[o.x+','+o.y];if(c)s[c]=true;};st.a.forEach(chk);st.boxes.forEach(chk);return s;}
// a door is passable only while its plate says open; someone caught inside just keeps it from shutting on them (jam), it does not let others in.
function doorStates(g,st,skip){const pr=pressedOf(g,st,skip);return g.doors.map(d=>{const on=!!pr[d.col];return d.inv?!on:on;});}
function doorJams(g,st){return g.doors.map(d=>st.a.some(q=>q.x===d.x&&q.y===d.y)||st.boxes.some(b=>b.x===d.x&&b.y===d.y));}
function step(g,st,acts){ // mutates st, returns events per agent
  const occ=(x,y)=>st.a.some(q=>q.x===x&&q.y===y);
  const boxAt=(x,y)=>st.boxes.find(b=>b.x===x&&b.y===y);
  const solid=(x,y,skip)=>{if(x<0||y<0||x>=g.W||y>=g.H)return true;if(g.tiles[y][x]==='#')return true;
    const di=g.doorAt[x+','+y];if(di!==undefined&&!doorStates(g,st,skip)[di])return true;return false;};
  const ev=st.a.map((e,i)=>{const a=acts[i];if(!a||a==='W')return 'wait';const [dx,dy]=DIRS[a];const nx=e.x+dx,ny=e.y+dy;
    if(solid(nx,ny,e))return 'bump'; // the mover lifts off its own plate as it steps
    const b=boxAt(nx,ny);
    if(b){const bx=nx+dx,by=ny+dy;if(solid(bx,by,b)||boxAt(bx,by)||occ(bx,by)||(g.exit&&bx===g.exit.x&&by===g.exit.y))return 'bump';b.x=bx;b.y=by;e.x=nx;e.y=ny;return 'push';}
    e.x=nx;e.y=ny;return 'move';});
  st.t++;const p=st.a[st.a.length-1];
  if(g.exit&&p.x===g.exit.x&&p.y===g.exit.y)st.won=true;
  return ev;
}
function snapOf(g,st,ev){return {t:st.t,a:st.a.map(q=>({...q})),boxes:st.boxes.map(b=>({...b})),doors:doorStates(g,st),jams:doorJams(g,st),pressed:pressedOf(g,st),ev,won:st.won};}
function simulate(g,recs,cur){
  const st=initState(g,recs.length);const frames=[snapOf(g,st,[])];
  for(let t=0;t<cur.length&&!st.won;t++){const acts=recs.map(r=>r[t]||'W');acts.push(cur[t]);frames.push(snapOf(g,st,step(g,st,acts)));}
  return frames;
}

const LEVELS=[
{name:'回声',cap:1,hint:'压力板被踩住时，同色的门才会打开。先走到压力板上，然后按 R 回溯——上一轮的你会变成影子，替你踩住它。',
map:["##########",
     "#S...#####",
     "#....#...#",
     "#.a..A.E.#",
     "#....#...#",
     "##########"],
sol:["DDR","DDRRRRRR"]},
{name:'接力',cap:2,hint:'影子也能走过别的影子替它打开的门。一层一层叠上去。',
map:["############",
     "#S...#.....#",
     "#....A..b..#",
     "#.a..#.....#",
     "#....###B###",
     "#....#.....#",
     "######..E..#",
     "############"],
sol:["DDR","DRRRRRRR","DRRRRRRRDDDD"]},
{name:'时机',cap:1,hint:'虚线门是「反向门」：同色压力板被踩住时，它反而会关上。按空格原地等待。',
map:["############",
     "#....#.....#",
     "#aS..1.....#",
     "#....####A##",
     "#....#...E.#",
     "############"],
sol:["WWWL","RRRRRRRDD"]},
{name:'搬运',cap:1,hint:'箱子也能压住压力板。只有一个影子名额，好好利用它。',
map:["############",
     "#S......####",
     "#..o....A..#",
     "#.......##B#",
     "#.a...b.##E#",
     "############"],
sol:["RRRRRDDD","RRRDLULDDURRRRRRRRDD"]},
{name:'游行',cap:3,hint:'三道门，三块压力板，每块都藏在前一道门后面。',
map:["###############",
     "#S..#...#...#E#",
     "#...A...B...C.#",
     "#.a.#.b.#.c.#.#",
     "###############"],
sol:["DDR","DRRRRRD","DRRRRRRRRRD","DRRRRRRRRRRRRU"]},
{name:'你先走',cap:1,hint:'影子只会重复你按过的键——哪怕当时你撞在了关着的门上。',
map:["############",
     "#S.....B..a#",
     "#..b...#####",
     "#......#...#",
     "#......A.E.#",
     "############"],
sol:["RRRRRRRRRRRR","RRDWWWDDRRRRRR"]},
{name:'放手',cap:2,hint:'有时候，帮忙的方式是及时松开。',
map:["#############",
     "#S...#...#..#",
     "#....A...1..#",
     "#.a..#...#.b#",
     "#....#...##B#",
     "#....######E#",
     "#############"],
sol:["DDRWWU","DRRRRRRRRRRD","DRRRRRRRRRRDDD"]},
{name:'交接班',cap:2,hint:'三块压力板，两个影子。总有人得身兼两职。',
map:["################",
     "#S..#.....#....#",
     "#...A..b..B....#",
     "#.a.#.....#....#",
     "#...#.######C###",
     "#####c######.E.#",
     "################"],
sol:["DDR","DRRRRRRWWWLLDDD","DRRRRRRRRRRRDWDDR"]},
{name:'绕路',cap:3,hint:'反向门后面的那块板，只有在没人踩着同色板时才进得去。',
map:["################",
     "#S..#.....#....#",
     "#...A..b..B..c.#",
     "#.a.#.....#....#",
     "########2##C####",
     "#######.d##.D.E#",

      for(let i=0;i<4;i++)px(col,X,Y+2+i*4,len,2);
      if(d.inv){for(let xx=0;xx<len;xx++)px(shade(col,-.7),X+xx,Y+1+((xx*2)%14),1,2);}
      px(shade(col,.4),X+len-1,Y+1,1,14);
    }
  }
  if(d.inv){b.globalAlpha=.9;for(let i=0;i<TS;i+=4){px(col,X+i,Y,2,1);px(col,X+i,Y+15,2,1);}b.globalAlpha=1;}
  if(jam&&k>0.02){b.globalAlpha=.5+.5*Math.sin(t/90);px('#ffffff',X+7,Y+1,2,2);b.globalAlpha=1;}}
function drawExit(x,y,t){const X=x*TS+8,Y=y*TS+8;drawFloor(x,y);
  for(let r=7;r>=1;r-=2){const ph=(t/300+r)%6;b.fillStyle=ph<3?'#7ee081':'#d8ffd9';b.globalAlpha=.35+.15*r/7;
    const s=Math.round(r+Math.sin(t/250+r)*0.6);b.fillRect(X-s,Y-s,s*2,s*2);}
  b.globalAlpha=1;px('#ffffff',X-1,Y-1,2,2);
  for(let i=0;i<3;i++){const a=t/500+i*2.1;px('#d8ffd9',Math.round(X+Math.cos(a)*6),Math.round(Y+Math.sin(a)*6));}}
function drawBox(x,y){const X=Math.round(x*TS),Y=Math.round(y*TS);
  px('#3b2414',X+1,Y+1,14,14);px('#a16a3c',X+2,Y+2,12,11);px('#c88b52',X+2,Y+2,12,1);
  px('#7b4e2a',X+2,Y+7,12,1);px('#7b4e2a',X+7,Y+2,1,11);px('#5c3a1f',X+2,Y+13,12,1);}
function drawGuy(spr,x,y,bob,alpha){b.globalAlpha=alpha;b.drawImage(spr,Math.round(x*TS),Math.round(y*TS-bob));b.globalAlpha=1;}
function drawDigit(n,X,Y,col){const d=DIGITS[n];if(!d)return;px('#13111d',X-1,Y-1,5,7);d.forEach((r,yy)=>{for(let i=0;i<3;i++)if(r[i]==='1')px(col,X+i,Y+yy);});}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.4+Math.random()*1.6;
  particles.push({x:x*TS+8,y:y*TS+8,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,life:40+Math.random()*30,col});}}

function render(now){
  requestAnimationFrame(render);
  if(!g)return;
  if(queue.length&&(!anim||now-anim.t0>=MOVE_MS)&&!rewinding){doAct(queue.shift());}
  tickAutoplay(now);
  let F,P=1,from=null,acts=null;
  if(rewinding){const p=Math.min(1,(now-rewinding.t0)/rewinding.ms);const e=p*p*(3-2*p);
    const idx=Math.round((1-e)*(rewinding.fr.length-1));F=rewinding.fr[idx];if(p>=1){finishRewind();F=curFrame();}}
  else{F=curFrame();if(anim){P=Math.min(1,(now-anim.t0)/MOVE_MS);from=anim.from;acts=anim.acts;if(P>=1)anim=null;}}
  const doorsShown=F.doors.map((o,i)=>o||F.jams[i]);
  doorOpen=doorOpen.map((v,i)=>{const tg=doorsShown[i]?1:0;return rewinding?tg:v+(tg-v)*0.35;});
  // board
  for(let y=0;y<g.H;y++)for(let x=0;x<g.W;x++){const c=g.tiles[y][x];if(c==='#')drawWall(x,y);else drawFloor(x,y);}
  for(const k in g.plates){const [x,y]=k.split(',').map(Number);drawPlate(x,y,g.plates[k],!!F.pressed[g.plates[k]]&&occupied(F,x,y),now);}
  g.doors.forEach((d,i)=>drawDoor(i,d,doorOpen[i],F.jams[i],now));
  if(g.exit)drawExit(g.exit.x,g.exit.y,now);
  // ghost path preview: where each ghost goes in the next steps if you stand still
  if(!rewinding&&!won&&ghosts.length){const fut=simulate(g,ghosts,cur.concat(['W','W','W','W','W']));
    for(let i=0;i<ghosts.length;i++){let prev=F.a[i];for(let s=1;s<=5;s++){const fr=fut[frames.length-1+s];if(!fr)break;const q=fr.a[i];
      if(q.x!==prev.x||q.y!==prev.y){b.globalAlpha=.75-s*.12;px(GHOST_COL[i],q.x*TS+7,q.y*TS+7,2,2);}prev=q;}b.globalAlpha=1;}}
  const lerp=(a,c)=>from?a+(c-a)*ease(P):c;
  F.boxes.forEach((bx,i)=>{const f0=from?from.boxes[i]:bx;drawBox(lerp(f0.x,bx.x),lerp(f0.y,bx.y));});
  const n=F.a.length;
  for(let i=n-1;i>=0;i--){} // draw order: ghosts first, player last
  for(let i=0;i<n;i++){const q=F.a[i];const q0=from?from.a[i]:q;let x=lerp(q0.x,q.x),y=lerp(q0.y,q.y),bob=0;
    const a=acts?acts[i]:'W';const ev=F.ev&&F.ev[i];
    if(a&&a!=='W'){if(a==='L')facing[i]=1;if(a==='R')facing[i]=0;}
    if(from&&ev==='bump'&&P<1){const k=Math.sin(P*Math.PI)*0.18;x+=DIRS[a][0]*k;y+=DIRS[a][1]*k;}
    if(from&&(ev==='move'||ev==='push')&&P<1)bob=Math.sin(P*Math.PI)*2;
    const isP=i===n-1;const fl=facing[i]||0;
    if(isP){b.globalAlpha=.35;px('#000',Math.round(x*TS)+3,Math.round(y*TS)+14,10,2);b.globalAlpha=1;drawGuy(heroSpr[fl],x,y,bob,1);}
    else{const gc=i%GHOST_COL.length;const flick=.55+.12*Math.sin(now/140+i*2);drawGuy(ghostSpr[gc][fl],x,y,bob,rewinding?.35:flick);
      drawDigit(i+1,Math.round(x*TS)+12,Math.round(y*TS-bob)+1,GHOST_COL[gc]);
      if(cur.length>=ghosts[i].length&&!rewinding){b.globalAlpha=.6;px(GHOST_COL[gc],Math.round(x*TS)+2,Math.round(y*TS)+15,12,1);b.globalAlpha=1;}}}
  // particles
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.life--;b.globalAlpha=Math.max(0,Math.min(1,p.life/30));px(p.col,Math.round(p.x),Math.round(p.y));return p.life>0;});b.globalAlpha=1;
  // blit
  ctx.imageSmoothingEnabled=false;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake*scale*.5;shake*=.85;if(shake<.3)shake=0;}
  if(rewinding){const strips=12,h=buf.height/strips;
    for(let s=0;s<strips;s++){const off=(Math.random()-.5)*6;ctx.drawImage(buf,0,s*h,buf.width,h,off*scale,s*h*scale,cv.width,h*scale);}
    ctx.fillStyle='rgba(94,230,230,.12)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(0,0,0,.25)';for(let y=0;y<cv.height;y+=Math.max(2,Math.round(scale)*2))ctx.fillRect(0,y,cv.width,Math.max(1,Math.round(scale)));
    ctx.fillStyle='#5ee6e6';ctx.font='bold '+Math.round(8*scale)+'px ui-monospace,monospace';ctx.textBaseline='top';ctx.fillText('◀◀ 回溯',6*scale,4*scale);
  }else ctx.drawImage(buf,sx,sy,cv.width,cv.height);
}
function occupied(F,x,y){return F.a.some(q=>q.x===x&&q.y===y)||F.boxes.some(q=>q.x===x&&q.y===y);}
function ease(p){return 1-Math.pow(1-p,3);}
let toastT=null;
function toast(msg,ms=2200){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}

// test hook
window.__game={LEVELS,load:i=>{loadLevel(i);},setFast:v=>{fast=v;},act:a=>doAct(rot?SW[a]:a),rotated:()=>rot,screenPos:()=>{const p=curFrame().a.at(-1);return {x:p.x,y:p.y,W:g.W,H:g.H};},rewind:()=>rewind(),
  state:()=>({level:li,won,ghosts:ghosts.length,steps:cur.length,player:curFrame().a.at(-1)}),showSel,hideOv,solve:()=>{solveArm=true;solve();}};

// boot: draw level 1 behind the title card
loadLevel(Math.min(store.get('zuori-last',0),LEVELS.length-1));$('titleOv').hidden=false;
requestAnimationFrame(render);
})();
</script>
